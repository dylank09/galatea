<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Galatea">
  <meta name="description" content="A personal hub for training and considered style.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/site.css">
  <script src="./assets/pwa.js" defer></script>
  <title>Galatea</title>
</head>
<body class="home-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="brand" href="./" aria-current="page"><img class="brand-icon" src="./icons/favicon.png" alt="" width="30" height="30">Galatea</a>
      <div class="nav-links">
        <a href="./gym/">Gym</a>
        <a href="./style/">Style</a>
      </div>
    </nav>
  </header>

  <main id="main" class="page-shell">
    <section class="hero home-hero" aria-labelledby="home-title">
      <div class="home-hero-copy">
        <p class="home-greeting" data-time-greeting aria-live="polite">Hello</p>
        <h1 id="home-title">A little help for today.</h1>
        <div class="hero-actions">
          <a class="button button-primary" href="./gym/">Move with Gym</a>
          <a class="button button-secondary" href="./style/">Style Cheatsheet</a>
        </div>
      </div>
      <figure class="home-portrait">
        <div class="home-portrait-orbit" aria-hidden="true"></div>
        <img src="./icons/portrait.png" alt="Galatea's illustrated character icon" width="320" height="320">
        <figcaption>A little less deciding.<br>A little more doing.</figcaption>
      </figure>
    </section>
  </main>

  <aside class="update-banner" data-update-banner hidden role="status">
    A new version is ready.
    <button class="button button-primary" type="button" data-update-reload>Reload</button>
  </aside>

  <footer class="site-footer">
    <div class="page-shell">Galatea · a few useful things, stored on this device.</div>
  </footer>
  <script>
    (() => {
      const greeting = document.querySelector("[data-time-greeting]");
      if (!greeting) return;

      const hour = new Date().getHours();
      greeting.textContent = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
    })();
  </script>
</body>
</html>
